<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Abyss Legend — Arena Web3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pixel-font: 'Press Start 2P', monospace;
      --ui-font: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; padding: 0; background: radial-gradient(circle at center, #1a162b 0%, #090710 100%);
      font-family: var(--ui-font); color: #f3f4f6; display: flex; justify-content: center;
      align-items: center; min-height: 100dvh; overflow: hidden;
    }

    /* Contenedor estilo Mini App móvil */
    .tma-frame {
      width: 100%; max-width: 430px; height: 100dvh; max-height: 900px;
      background: #0d0b14; display: flex; flex-direction: column; position: relative;
      overflow: hidden; box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(139, 92, 246, 0.25);
    }
    @media (min-width: 450px) { .tma-frame { height: 94dvh; border-radius: 24px; } }

    .pixel-text { font-family: var(--pixel-font); letter-spacing: -0.5px; }

    /* Overlay Cuenta Regresiva */
    #countdown-overlay {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 9999;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      transition: opacity 0.5s;
    }
    .countdown-text { font-size: 80px; color: #facc15; font-family: var(--pixel-font); text-shadow: 0 0 20px #b45309; }

    /* Escenario 2.5D */
    .battle-stage {
      position: relative; flex: 1; width: 100%; overflow: hidden;
      background: radial-gradient(ellipse at 75% 22%, rgba(220, 38, 38, 0.22) 0%, transparent 55%),
                  radial-gradient(ellipse at 25% 75%, rgba(124, 58, 237, 0.18) 0%, transparent 60%),
                  linear-gradient(180deg, #120c1f 0%, #1d1330 38%, #2a1836 62%, #140e1c 100%);
    }

    .stage-floor-grid {
      position: absolute; inset: 30% -20% -10% -20%;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 20px; transform: perspective(300px) rotateX(55deg); pointer-events: none;
    }

    .platform-enemy { position: absolute; top: 31%; right: 6%; width: 165px; height: 58px; transform: translateZ(0); }
    .platform-hero { position: absolute; bottom: 8%; left: 5%; width: 195px; height: 68px; transform: translateZ(0); }

    /* Animaciones */
    @keyframes idleFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes hitShake {
      0%, 100% { transform: translate(0, 0); filter: brightness(1); }
      20% { transform: translate(-8px, -3px); filter: brightness(2.5) drop-shadow(0 0 8px #ef4444); }
      40% { transform: translate(8px, 3px); filter: brightness(2); }
      60% { transform: translate(-6px, 2px); }
      80% { transform: translate(6px, -2px); }
    }
    @keyframes heroAttackLunge { 0% { transform: translate(0, 0) scale(1); } 35% { transform: translate(28px, -24px) scale(1.08); } 100% { transform: translate(0, 0) scale(1); } }
    @keyframes enemyAttackLunge { 0% { transform: translate(0, 0) scale(1); } 35% { transform: translate(-28px, 24px) scale(1.08); } 100% { transform: translate(0, 0) scale(1); } }
    @keyframes floatUpFade { 0% { opacity: 1; transform: translateY(0) scale(0.8); } 25% { opacity: 1; transform: translateY(-14px) scale(1.1); } 100% { opacity: 0; transform: translateY(-42px) scale(0.95); } }

    .sprite-idle { animation: idleFloat 2.4s ease-in-out infinite; }
    .sprite-hit { animation: hitShake 0.42s ease-in-out !important; }
    .lunge-hero { animation: heroAttackLunge 0.38s cubic-bezier(0.22, 1, 0.36, 1) !important; }
    .lunge-enemy { animation: enemyAttackLunge 0.38s cubic-bezier(0.22, 1, 0.36, 1) !important; }

    .floating-dmg { position: absolute; pointer-events: none; z-index: 50; font-family: var(--pixel-font); text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; animation: floatUpFade 1.15s ease-out forwards; white-space: nowrap; }

    .rpg-btn { position: relative; transition: all 0.12s ease; border-bottom-width: 4px; }
    .rpg-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
    .rpg-btn:disabled { opacity: 0.42; filter: grayscale(0.7); cursor: not-allowed; }
    .bar-fill { transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    svg.pixel-svg { shape-rendering: crispEdges; }
  </style>
</head>
<body>
  <div class="tma-frame">

    <!-- Overlay de Carga y Cuenta Regresiva -->
    <div id="countdown-overlay">
      <div id="cd-text" class="countdown-text">CARGANDO</div>
      <div id="cd-subtext" class="text-sm text-slate-400 mt-4 font-bold">Conectando con la Arena...</div>
    </div>

    <!-- Cabecera y Turno -->
    <div class="bg-[#0b0914]/90 border-b border-slate-800/80 px-3 py-1.5 flex items-center justify-between z-20">
      <div class="flex items-center gap-2">
        <span id="turnBadge" class="px-2 py-0.5 rounded text-[10px] font-extrabold uppercase bg-slate-500/20 text-slate-300 border border-slate-500/40">ESPERANDO</span>
        <span id="turnSubtext" class="text-xs text-slate-300 font-medium">Sincronizando...</span>
      </div>
    </div>

    <!-- Campo de Batalla -->
    <div id="battleStage" class="battle-stage">
      <div class="stage-floor-grid"></div>
      
      <!-- VFX Canvas -->
      <canvas id="vfxCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-30"></canvas>
      <div id="floatingTextLayer" class="absolute inset-0 pointer-events-none z-40"></div>

      <!-- HUD Rival -->
      <div class="absolute top-3 left-3 w-[56%] max-w-[230px] bg-[#130f22]/90 backdrop-blur-md border-2 border-rose-900/70 rounded-xl p-2.5 shadow-xl z-20">
        <div class="flex justify-between items-baseline mb-0.5">
          <span id="enemyName" class="text-xs font-extrabold text-rose-100 truncate">Rival</span>
        </div>
        <div class="w-full bg-slate-950 h-3 rounded-md p-[1px] border border-slate-700 mb-1 relative overflow-hidden">
          <div id="enemyHpBar" class="bar-fill h-full bg-gradient-to-r from-rose-600 to-red-400 rounded-sm" style="width: 100%;"></div>
          <span id="enemyHpText" class="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-white drop-shadow">0 / 0 HP</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-[10px]">🛡️</span>
          <div class="flex-1 bg-slate-950 h-2 rounded-md overflow-hidden border border-slate-800">
            <div id="enemyShieldBar" class="bar-fill h-full bg-cyan-400" style="width: 0%;"></div>
          </div>
          <span id="enemyShieldText" class="text-[10px] font-bold text-cyan-300">0</span>
        </div>
      </div>

      <!-- Enemigo 2.5D -->
      <div class="platform-enemy">
        <svg viewBox="0 0 180 70" class="w-full h-full">
          <ellipse cx="90" cy="42" rx="84" ry="24" fill="rgba(0,0,0,0.65)" />
          <ellipse cx="90" cy="36" rx="78" ry="20" fill="#2c1d3d" stroke="#583c78" stroke-width="2" />
          <path d="M12,36 C12,54 168,54 168,36 L160,48 C145,62 35,62 20,48 Z" fill="#1b1126" stroke="#3f2a56" stroke-width="1.5" />
          <ellipse cx="90" cy="35" rx="58" ry="13" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="6 4" opacity="0.45" />
        </svg>
      </div>
      <div id="enemySpriteContainer" class=" absolute top-[9%] right-[9%] w-32 h-36 flex items-center justify-center z-10 sprite-idle">
        <svg viewBox="0 0 32 36" class="w-full h-full pixel-svg drop-shadow-[0_6px_8px_rgba(0,0,0,0.8)]">
          <!-- Sprite genérico del rival (Caballero Abisal) -->
          <ellipse cx="16" cy="33" rx="9" ry="2.5" fill="rgba(0,0,0,0.55)" />
          <path d="M8,12 L6,31 L26,31 L24,12 Z" fill="#7f1d1d" />
          <path d="M9,13 L7,30 L25,30 L23,13 Z" fill="#991b1b" />
          <rect x="11" y="25" width="4" height="7" fill="#1e293b" />
          <rect x="17" y="25" width="4" height="7" fill="#1e293b" />
          <rect x="10" y="14" width="12" height="11" fill="#0f172a" />
          <rect x="11" y="15" width="10" height="9" fill="#334155" />
          <rect x="10" y="5" width="12" height="9" fill="#1e293b" />
          <rect x="11" y="6" width="10" height="7" fill="#0f172a" />
          <rect x="12" y="9" width="3" height="2" fill="#f43f5e" />
          <rect x="17" y="9" width="3" height="2" fill="#f43f5e" />
          <g id="enemyWeaponGroup">
            <rect x="4" y="3" width="3" height="13" fill="#e11d48" />
            <rect x="5" y="2" width="2" height="14" fill="#fda4af" />
          </g>
        </svg>
      </div>

      <!-- HUD Héroe -->
      <div class="absolute bottom-3 right-3 w-[56%] max-w-[230px] bg-[#111526]/95 backdrop-blur-md border-2 border-indigo-600/70 rounded-xl p-2.5 shadow-xl z-20">
        <div class="flex justify-between items-baseline mb-0.5">
          <span id="heroName" class="text-xs font-extrabold text-indigo-100 truncate">Tú</span>
        </div>
        <div class="w-full bg-slate-950 h-3 rounded-md p-[1px] border border-slate-700 mb-1 relative overflow-hidden">
          <div id="heroHpBar" class="bar-fill h-full bg-gradient-to-r from-emerald-600 to-green-400 rounded-sm" style="width: 100%;"></div>
          <span id="heroHpText" class="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-white drop-shadow">0 / 0 HP</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-[10px]">🛡️</span>
          <div class="flex-1 bg-slate-950 h-2 rounded-md overflow-hidden border border-slate-800">
            <div id="heroShieldBar" class="bar-fill h-full bg-cyan-400" style="width: 0%;"></div>
          </div>
          <span id="heroShieldText" class="text-[10px] font-bold text-cyan-300">0</span>
        </div>
      </div>

      <!-- Héroe 2.5D -->
      <div class="platform-hero">
        <svg viewBox="0 0 210 80" class="w-full h-full">
          <ellipse cx="105" cy="48" rx="98" ry="26" fill="rgba(0,0,0,0.7)" />
          <ellipse cx="105" cy="40" rx="92" ry="22" fill="#232c43" stroke="#6366f1" stroke-width="2" />
          <path d="M13,40 C13,62 197,62 197,40 L188,55 C165,71 45,71 22,55 Z" fill="#131826" stroke="#3730a3" stroke-width="1.5" />
          <ellipse cx="105" cy="39" rx="70" ry="15" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.5" />
        </svg>
      </div>
      <div id="heroSpriteContainer" class="absolute bottom-[11%] left-[9%] w-36 h-40 flex items-center justify-center z-10 sprite-idle">
        <svg viewBox="0 0 36 38" class="w-full h-full pixel-svg drop-shadow-[0_8px_10px_rgba(0,0,0,0.85)]">
          <ellipse cx="16" cy="35" rx="10" ry="2.5" fill="rgba(0,0,0,0.6)" />
          <rect x="11" y="28" width="4" height="6" fill="#1f2937" />
          <rect x="17" y="28" width="4" height="6" fill="#1f2937" />
          
          <!-- Capas Inyectadas por JS según equipamiento -->
          <g id="heroArmorLayer"></g>
          
          <g id="heroHeadLayer">
            <rect x="11" y="6" width="10" height="8" fill="#334155" />
            <rect x="10" y="8" width="12" height="5" fill="#475569" />
            <rect x="11" y="12" width="10" height="3" fill="#0f172a" />
          </g>
          
          <rect x="22" y="16" width="4" height="5" fill="#475569" />
          
          <g id="heroWeaponLayer"></g>
        </svg>
      </div>
    </div>

    <!-- Panel de Control y Botones -->
    <div class="bg-[#110e1c] border-t-2 border-purple-800/60 px-3 pt-2 pb-3 z-30 shadow-[0_-10px_25px_rgba(0,0,0,0.7)]">
      
      <!-- Bitácora -->
      <div id="combatLogBox" class="bg-[#090710] border border-slate-800 rounded-lg px-2.5 py-1.5 mb-2 text-xs text-slate-200 font-medium h-[40px] overflow-y-auto flex items-center justify-between">
        <span id="combatLogText">⏳ Cargando arena...</span>
      </div>

      <!-- Maná y Auxiliares -->
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <div class="flex items-center gap-1.5 bg-[#0a0812] px-2.5 py-1.5 rounded-xl border border-sky-900/60">
          <span class="text-[10px] font-extrabold uppercase text-sky-400 mr-0.5">Maná</span>
          <div id="manaCrystalsContainer" class="flex items-center gap-1"></div>
          <span id="manaCountText" class="pixel-text text-[10px] text-sky-300 ml-1">0/5</span>
        </div>
        
        <div class="flex items-center gap-1.5">
          <button id="btnAccessory" onclick="sendAction('accessory')" class="rpg-btn bg-gradient-to-b from-teal-700 to-teal-900 border-teal-950 text-teal-100 rounded-xl px-2.5 py-1.5 flex items-center gap-1.5" disabled>
            <span class="text-sm">💍</span>
            <div class="text-left leading-tight">
              <div class="text-[10px] font-extrabold">Accesorio</div>
              <div class="text-[9px] text-sky-300 font-bold">2💧 +Escudo</div>
            </div>
          </button>
          <button id="btnPass" onclick="sendAction('pass')" class="rpg-btn bg-gradient-to-b from-slate-700 to-slate-800 border-slate-950 text-slate-200 rounded-xl px-2.5 py-1.5 flex flex-col items-center justify-center" disabled>
            <span class="text-xs">⏭️</span>
            <span class="text-[9px] font-bold">Pasar</span>
          </button>
        </div>
      </div>

      <!-- 3 Botones de Ataque Principales -->
      <div class="grid grid-cols-3 gap-2">
        <button id="btnBasic" onclick="sendAction('basic')" class="rpg-btn bg-gradient-to-b from-slate-700 via-slate-800 to-slate-900 border-slate-950 text-white rounded-xl p-2 flex flex-col items-center justify-between" disabled>
          <div class="w-full flex justify-between items-center mb-0.5">
            <span class="text-[9px] font-bold text-slate-400">Básico</span>
            <span class="bg-sky-950 text-sky-300 rounded px-1 text-[10px] font-extrabold">1💧</span>
          </div>
          <div class="text-xl my-0.5">⚔️</div>
          <div class="text-[11px] font-extrabold text-slate-100 leading-tight">Golpe Rápido</div>
        </button>

        <button id="btnWeapon" onclick="sendAction('weapon')" class="rpg-btn bg-gradient-to-b from-amber-600 via-amber-700 to-amber-900 border-amber-950 text-white rounded-xl p-2 flex flex-col items-center justify-between" disabled>
          <div class="w-full flex justify-between items-center mb-0.5">
            <span class="text-[9px] font-bold text-amber-200">Arma</span>
            <span class="bg-sky-950 text-sky-300 rounded px-1 text-[10px] font-extrabold">2💧</span>
          </div>
          <div id="btnWeaponIcon" class="text-xl my-0.5">🗡️</div>
          <div id="btnWeaponName" class="text-[11px] font-extrabold text-amber-50 leading-tight truncate w-full text-center">Arma</div>
        </button>

        <button id="btnSkill" onclick="sendAction('skill')" class="rpg-btn bg-gradient-to-b from-purple-600 via-purple-800 to-indigo-950 border-purple-950 text-white rounded-xl p-2 flex flex-col items-center justify-between" disabled>
          <div class="w-full flex justify-between items-center mb-0.5">
            <span class="text-[9px] font-bold text-purple-200">Especial</span>
            <span class="bg-sky-950 text-sky-300 rounded px-1 text-[10px] font-extrabold">3💧</span>
          </div>
          <div class="text-xl my-0.5">🔥</div>
          <div class="text-[11px] font-extrabold text-purple-100 leading-tight">Nova Abisal</div>
        </button>
      </div>

    </div>

    <!-- Modal Final -->
    <div id="endModal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-6">
      <div class="bg-[#161224] border-2 border-amber-500/70 rounded-2xl p-5 text-center w-full max-w-xs shadow-2xl">
        <div id="endModalIcon" class="text-5xl mb-2">🏆</div>
        <h2 id="endModalTitle" class="pixel-text text-sm text-amber-400 mb-2">COMBATE FINALIZADO</h2>
        <p id="endModalDesc" class="text-xs text-slate-300 mb-4 leading-relaxed">El duelo ha terminado. Cierra esta ventana para volver a la taberna.</p>
        <button onclick="window.Telegram?.WebApp?.close() || window.close()" class="w-full bg-gradient-to-r from-slate-600 to-slate-800 hover:from-slate-500 hover:to-slate-700 text-white font-extrabold py-2.5 rounded-xl text-xs shadow-lg">
          Salir de la Arena
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // INVENTARIO SVG (PARA DIBUJAR AL HÉROE)
    // ==========================================
    const WEAPONS = {
      iron_sword: { icon: '🗡️', name: 'Tajo de Hierro', color: '#38bdf8', type: 'slash', svg: `<rect x="24" y="17" width="3" height="4" fill="#78350f" /><rect x="22" y="15" width="7" height="2" fill="#fbbf24" /><rect x="24" y="4" width="3" height="11" fill="#cbd5e1" /><rect x="25" y="3" width="2" height="12" fill="#f8fafc" />` },
      khazur_pickaxe: { icon: '⛏️', name: 'Rompe-Escudos', color: '#f59e0b', type: 'pickaxe', svg: `<rect x="25" y="6" width="2" height="15" fill="#92400e" /><rect x="25" y="10" width="2" height="3" fill="#fbbf24" /><path d="M19,7 L26,4 L33,8 L31,10 L26,7 L21,9 Z" fill="#38bdf8" /><rect x="25" y="4" width="2" height="3" fill="#facc15" />` },
      obsidian_blade: { icon: '🖤', name: 'Corte Carmesí', color: '#f43f5e', type: 'crimson_slash', svg: `<rect x="24" y="17" width="3" height="4" fill="#4c0519" /><rect x="21" y="15" width="9" height="2" fill="#e11d48" /><path d="M24,15 L24,3 L27,1 L28,15 Z" fill="#18181b" /><path d="M26,15 L26,2 L28,5 L27,9 L28,12 Z" fill="#f43f5e" />` },
      malakor_scepter: { icon: '🔮', name: 'Drenaje', color: '#a855f7', type: 'void_beam', svg: `<rect x="25" y="8" width="2" height="14" fill="#3b0764" /><path d="M22,8 L24,5 L28,5 L30,8 L28,10 L24,10 Z" fill="#9333ea" /><rect x="24" y="3" width="4" height="4" fill="#e879f9" /><rect x="25" y="4" width="2" height="2" fill="#ffffff" />` },
      dagger: { icon: '🔪', name: 'Puñalada', color: '#cbd5e1', type: 'slash', svg: `<rect x="24" y="15" width="2" height="4" fill="#78350f" /><rect x="24" y="9" width="2" height="6" fill="#cbd5e1" />` }
    };
    const ARMORS = {
      cloth_tunic: `<path d="M10,14 L8,32 L24,32 L22,14 Z" fill="#1e3a8a" /><path d="M11,15 L9,31 L23,31 L21,15 Z" fill="#2563eb" />`,
      iron_cuirass: `<path d="M10,14 L8,32 L24,32 L22,14 Z" fill="#991b1b" /><rect x="11" y="14" width="10" height="11" fill="#64748b" /><rect x="12" y="15" width="8" height="9" fill="#94a3b8" />`,
      vaelgathar_scales: `<path d="M9,14 L7,32 L25,32 L23,14 Z" fill="#18181b" /><path d="M11,15 L9,31 L23,31 L21,15 Z" fill="#27272a" /><rect x="15" y="15" width="2" height="13" fill="#ea580c" />`,
      none: `<rect x="11" y="14" width="10" height="11" fill="#475569" />`
    };

    // ==========================================
    // LÓGICA DE API Y ESTADO
    // ==========================================
    const urlParams = new URLSearchParams(window.location.search);
    const duelId = urlParams.get('duelId');
    const userId = parseInt(urlParams.get('userId'), 10);
    
    let isMyTurn = false;
    let pollInterval = null;
    let currentHeroHp = 0;
    let currentEnemyHp = 0;
    let cachedWeapon = 'dagger';

    window.onload = () => {
      const tg = window.Telegram?.WebApp;
      if (tg) tg.expand();
      startCountdown();
    };

    function startCountdown() {
      let count = 3;
      const overlayText = document.getElementById('cd-text');
      const sub = document.getElementById('cd-subtext');
      
      const timer = setInterval(() => {
        if (count > 0) {
          overlayText.innerText = count;
          sub.innerText = "Preparando equipo...";
          count--;
        } else if (count === 0) {
          overlayText.innerText = '¡LUCHEN!';
          sub.innerText = "";
          count--;
        } else {
          clearInterval(timer);
          document.getElementById('countdown-overlay').style.opacity = 0;
          setTimeout(() => {
            document.getElementById('countdown-overlay').style.display = 'none';
            loadDuelData(); // Llama al backend al terminar
          }, 500);
        }
      }, 1000);
    }

    async function loadDuelData() {
      try {
        const res = await fetch(`/api/pvp/duel-data?duelId=${duelId}&userId=${userId}`);
        const data = await res.json();
        if (data.error) {
          document.getElementById('combatLogText').innerHTML = `<span style="color:#ef4444;">Error: ${data.error}</span>`;
          return;
        }
        updateUI(data);

        if (!pollInterval) {
          pollInterval = setInterval(() => {
            if (!isMyTurn) loadDuelData();
          }, 2500); // Poll cada 2.5 seg
        }
      } catch (err) { console.error(err); }
    }

    function updateUI(data) {
      const hero = data.hero;
      const enemy = data.enemy;
      isMyTurn = (data.turn === userId && data.status === 'active');
      cachedWeapon = hero.weapon || 'dagger';

      // Actualizar Nombres
      document.getElementById('heroName').innerText = hero.name;
      document.getElementById('enemyName').innerText = enemy.name;

      // Actualizar Barras de Vida (Detectando si bajaron para hacer vibrar el sprite)
      if (currentHeroHp > 0 && hero.hp < currentHeroHp) triggerHitAnimation('heroSpriteContainer');
      if (currentEnemyHp > 0 && enemy.hp < currentEnemyHp) triggerHitAnimation('enemySpriteContainer');
      
      currentHeroHp = hero.hp;
      currentEnemyHp = enemy.hp;

      document.getElementById('heroHpBar').style.width = `${Math.max(0, (hero.hp / hero.maxHp) * 100)}%`;
      document.getElementById('heroHpText').innerText = `${hero.hp} / ${hero.maxHp} HP`;
      document.getElementById('enemyHpBar').style.width = `${Math.max(0, (enemy.hp / enemy.maxHp) * 100)}%`;
      document.getElementById('enemyHpText').innerText = `${enemy.hp} / ${enemy.maxHp} HP`;

      // Escudos
      document.getElementById('heroShieldText').innerText = hero.shield;
      document.getElementById('enemyShieldText').innerText = enemy.shield;
      document.getElementById('heroShieldBar').style.width = `${Math.min(100, hero.shield)}%`;
      document.getElementById('enemyShieldBar').style.width = `${Math.min(100, enemy.shield)}%`;

      // Maná (Cristales Visuales)
      const mcContainer = document.getElementById('manaCrystalsContainer');
      mcContainer.innerHTML = '';
      for (let i = 0; i < hero.maxMana; i++) {
        const active = i < hero.mana;
        mcContainer.innerHTML += `
          <div class="w-3 h-4 flex items-center justify-center ${active ? 'opacity-100' : 'opacity-25 scale-90'}">
            <svg viewBox="0 0 16 20" class="w-full h-full">
              <polygon points="8,1 15,8 8,19 1,8" fill="${active ? '#38bdf8' : '#334155'}" />
            </svg>
          </div>`;
      }
      document.getElementById('manaCountText').innerText = `${hero.mana}/${hero.maxMana}`;

      // Inyectar Equipo Visual al Héroe
      const wData = WEAPONS[hero.weapon] || WEAPONS.dagger;
      document.getElementById('heroWeaponLayer').innerHTML = wData.svg;
      document.getElementById('heroArmorLayer').innerHTML = ARMORS[hero.armor] || ARMORS.none;
      
      // Actualizar botón de Arma según backend
      document.getElementById('btnWeaponIcon').innerText = wData.icon;
      document.getElementById('btnWeaponName').innerText = wData.name;

      // Último Log
      if (data.log && data.log.length > 0) {
        document.getElementById('combatLogText').innerText = data.log[data.log.length - 1];
      }

      // Panel Superior e Habilitar Botones
      const badge = document.getElementById('turnBadge');
      const sub = document.getElementById('turnSubtext');

      if (data.status === 'completed') {
        clearInterval(pollInterval);
        badge.innerText = 'FINALIZADO'; badge.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
        sub.innerText = 'El duelo ha concluido';
        lockButtons(true);
        setTimeout(() => document.getElementById('endModal').classList.remove('hidden'), 1500);
      } else if (isMyTurn) {
        badge.innerText = 'TU TURNO'; badge.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
        sub.innerText = 'Elige tu acción';
        
        document.getElementById('btnBasic').disabled = hero.mana < 1;
        document.getElementById('btnWeapon').disabled = hero.mana < 2;
        document.getElementById('btnSkill').disabled = hero.mana < 3;
        document.getElementById('btnAccessory').disabled = hero.mana < 2;
        document.getElementById('btnPass').disabled = false;
      } else {
        badge.innerText = 'RIVAL'; badge.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold uppercase bg-rose-500/20 text-rose-300 border border-rose-500/40';
        sub.innerText = 'Esperando movimiento...';
        lockButtons(true);
      }
    }

    async function sendAction(actionType) {
      if (!isMyTurn) return;
      lockButtons(true);

      // Reproducir animación predictiva antes de esperar al server
      const heroEl = document.getElementById('heroSpriteContainer');
      heroEl.classList.add('lunge-hero');
      setTimeout(() => heroEl.classList.remove('lunge-hero'), 400);
      
      const wData = WEAPONS[cachedWeapon] || WEAPONS.dagger;
      if (actionType === 'basic') playCanvasVfx('enemy', 'slash', '#e2e8f0');
      else if (actionType === 'weapon') playCanvasVfx('enemy', wData.type, wData.color);
      else if (actionType === 'skill') playCanvasVfx('enemy', 'nova', '#a855f7');
      else if (actionType === 'accessory') playCanvasVfx('hero', 'shield_aura', '#2dd4bf');

      try {
        const res = await fetch('/api/pvp/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ duelId, userId, actionType })
        });
        const data = await res.json();
        
        if (data.success) {
          // El backend respondió con éxito, recargamos el estado visual
          loadDuelData();
        } else {
          alert(data.error);
          loadDuelData(); // Resincroniza por si hubo un fallo
        }
      } catch (err) {
        console.error('Error enviando acción', err);
        lockButtons(false);
      }
    }

    function lockButtons(locked) {
      document.querySelectorAll('.rpg-btn').forEach(btn => btn.disabled = locked);
    }

    function triggerHitAnimation(elementId) {
      const el = document.getElementById(elementId);
      el.classList.remove('sprite-hit');
      void el.offsetWidth;
      el.classList.add('sprite-hit');
    }

    // Dibujado VFX (El mismo de tu prototipo original)
    function playCanvasVfx(target, type, color = '#38bdf8') {
      const canvas = document.getElementById('vfxCanvas');
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width; canvas.height = rect.height;
      const ctx = canvas.getContext('2d');
      const cx = target === 'enemy' ? canvas.width * 0.76 : canvas.width * 0.25;
      const cy = target === 'enemy' ? canvas.height * 0.26 : canvas.height * 0.72;
      let frame = 0; const maxFrames = 18;

      function animateVfx() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const progress = frame / maxFrames;
        ctx.save();
        if (type === 'slash' || type === 'crimson_slash') {
          ctx.strokeStyle = color; ctx.lineWidth = (1 - progress) * 10; ctx.shadowColor = color; ctx.shadowBlur = 15;
          ctx.beginPath(); ctx.moveTo(cx - 45 + progress * 20, cy - 40 + progress * 20);
          ctx.quadraticCurveTo(cx + 15, cy, cx + 45 - progress * 10, cy + 40 - progress * 10); ctx.stroke();
        } else if (type === 'pickaxe') {
          ctx.strokeStyle = '#facc15'; ctx.lineWidth = 4 * (1 - progress);
          ctx.beginPath(); ctx.arc(cx, cy, progress * 55, 0, Math.PI * 2); ctx.stroke();
        } else if (type === 'void_beam' || type === 'nova') {
          const radius = progress * (type === 'nova' ? 75 : 50);
          const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, radius);
          grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, color); grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
        } else if (type === 'shield_aura') {
          ctx.strokeStyle = '#2dd4bf'; ctx.lineWidth = 3 * (1 - progress);
          ctx.beginPath(); ctx.arc(cx, cy, 45 - progress * 10, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
        frame++;
        if (frame <= maxFrames) requestAnimationFrame(animateVfx);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(animateVfx);
    }
  </script>
